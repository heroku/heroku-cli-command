name: Release on Push

on:
  push:
    branches: [main, beta]

permissions:
  contents: read

jobs:
  trust-configuration-notice:
    if: >-
      github.repository == 'heroku/heroku-cli-command' &&
      vars.CREDENTIAL_MANAGER_INSTALL_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Explain fail-closed release completion
        run: echo 'GitHub release completion is disabled until an owner protects CredentialManagerInstall and main/beta, then sets CREDENTIAL_MANAGER_INSTALL_ENABLED=true.'

  create-release:
    if: >-
      github.repository == 'heroku/heroku-cli-command' &&
      vars.CREDENTIAL_MANAGER_INSTALL_ENABLED == 'true' &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta')
    environment: CredentialManagerInstall
    runs-on: pub-hk-ubuntu-24.04-ip
    permissions:
      contents: write
    steps:
      - name: Generate release GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.DEV_TOOLS_RELEASE_WORKFLOW_APP_ID }}
          private-key: ${{ secrets.DEV_TOOLS_RELEASE_WORKFLOW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: heroku-cli-command
          permission-contents: write
          permission-pull-requests: write
      - name: Generate workflow helper read token
        id: helper-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.DEV_TOOLS_RELEASE_WORKFLOW_APP_ID }}
          private-key: ${{ secrets.DEV_TOOLS_RELEASE_WORKFLOW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: npm-release-workflows
          permission-contents: read
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check out shared release workflows
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: heroku/npm-release-workflows
          token: ${{ steps.helper-token.outputs.token }}
          path: workflows-repo
          ref: 9cc6da3718f77f2abce513df70298d1ec821e516
          persist-credentials: false
      - name: Create GitHub Release
        uses: ./workflows-repo/.github/actions/release-on-push-create-release-public
        with:
          package-manager: npm
          node-version: '22'
          branch_name: ${{ github.ref_name }}
          token: ${{ steps.app-token.outputs.token }}
