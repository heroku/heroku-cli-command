name: Node CI Suite - Acceptance

on:
  push:
    branches: [v14.0.0, main, beta]
  pull_request:
    branches: [v14.0.0]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node-version: [22.x, 24.x]
    env:
      ACCEPTANCE_TESTS: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - name: Prepare anonymous npm configuration
        run: node scripts/public-npm-config.mjs
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Rebuild dependencies
        run: npm rebuild
      - name: Install libsecret tools for Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-tools gnome-keyring
      - name: Run acceptance tests on macOS and Windows
        if: runner.os != 'Linux'
        run: npm run test:ci:acceptance
      - name: Run acceptance tests on Linux
        if: runner.os == 'Linux'
        run: |
          # The command substitution intentionally expands in the child shell.
          # shellcheck disable=SC2016
          dbus-run-session -- bash -c '
            eval "$(echo -n "heroku-credential-manager-ci" | gnome-keyring-daemon --unlock --components=secrets)"
            npm run test:ci:acceptance
          '
      - name: Remove isolated public npm configuration
        if: always()
        run: node scripts/public-npm-config.mjs cleanup
