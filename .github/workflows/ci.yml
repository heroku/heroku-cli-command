name: Node CI Suite

on:
  push:
    branches: [v14.0.0, main, beta]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural-gate:
    name: Secret-free structural gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Parse owned workflow and action YAML
        shell: ruby {0}
        run: |
          require 'yaml'
          files = Dir['.github/workflows/*.{yml,yaml}', '.github/actions/**/*.{yml,yaml}']
          files.each { |file| YAML.parse_file(file) }
          puts "parsed #{files.length} workflow/action YAML files"
      - name: Run public npm install invariants
        run: node .github/scripts/public-npm-install-canary.mjs
      - name: Install checksum-verified actionlint
        shell: bash
        env:
          EXPECTED_RUNNER_ARCH: X64
          EXPECTED_RUNNER_OS: Linux
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = "$EXPECTED_RUNNER_OS"
          test "$RUNNER_ARCH" = "$EXPECTED_RUNNER_ARCH"
          ACTIONLINT_VERSION='1.7.7'
          ACTIONLINT_SHA256='023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757'
          ARCHIVE="$RUNNER_TEMP/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$ARCHIVE"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$ARCHIVE" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/actionlint-bin"
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP/actionlint-bin" actionlint
          "$RUNNER_TEMP/actionlint-bin/actionlint" -version
      - name: Run mandatory actionlint
        run: >-
          "$RUNNER_TEMP/actionlint-bin/actionlint"
          -ignore 'label "pub-hk-ubuntu-24.04-ip" is unknown'
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x
          package-manager-cache: false
      - name: Prepare anonymous npm configuration
        run: node scripts/public-npm-config.mjs
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Rebuild dependencies
        run: npm rebuild
      - name: Lint
        run: npm run lint
      - name: Remove isolated public npm configuration
        if: always()
        run: node scripts/public-npm-config.mjs cleanup

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node-version: [22.x, 24.x]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - name: Prepare anonymous npm configuration
        run: node scripts/public-npm-config.mjs
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Rebuild dependencies
        run: npm rebuild
      - name: Run unit tests
        run: npm run test:coverage
      - name: Remove isolated public npm configuration
        if: always()
        run: node scripts/public-npm-config.mjs cleanup

  verifiers:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and baseline history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x
          package-manager-cache: false
      - name: Prepare anonymous npm configuration
        run: node scripts/public-npm-config.mjs
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Rebuild dependencies
        run: npm rebuild
      - name: Run packed consumer verification
        run: npm run verify:packed-consumer
      - name: Run rollback verification
        run: npm run verify:rollback
      - name: Remove isolated public npm configuration
        if: always()
        run: node scripts/public-npm-config.mjs cleanup
