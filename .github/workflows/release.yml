name: Release

# Public repo workflow using GitHub App token to access private npm-release-workflows
# Uses vars.DEV_TOOLS_RELEASE_WORKFLOW_APP_ID and secrets.DEV_TOOLS_RELEASE_WORKFLOW_APP_PRIVATE_KEY

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Test release without publishing (creates PR but skips npm publish)'
        type: boolean
        default: false
        required: false

permissions:
  contents: read

jobs:
  validate:
    if: >-
      github.repository == 'heroku/heroku-cli-command' &&
      github.event_name == 'workflow_dispatch' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta')
    runs-on: pub-hk-ubuntu-24.04-ip
    steps:
      - name: Generate workflow helper read token
        id: helper-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.DEV_TOOLS_RELEASE_WORKFLOW_APP_ID }}
          private-key: ${{ secrets.DEV_TOOLS_RELEASE_WORKFLOW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: npm-release-workflows
          permission-contents: read

      - name: Check out candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check out shared release workflows
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: heroku/npm-release-workflows
          token: ${{ steps.helper-token.outputs.token }}
          path: workflows-repo
          ref: main
          persist-credentials: false

      - name: Validate and test
        uses: ./workflows-repo/.github/actions/release-validate-public
        with:
          package-manager: npm
          lint_command: 'run lint'
          test_command: 'test'

  release-please-pr:
    needs: validate
    if: >-
      needs.validate.result == 'success' &&
      github.repository == 'heroku/heroku-cli-command' &&
      github.event_name == 'workflow_dispatch' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta')
    runs-on: pub-hk-ubuntu-24.04-ip
    permissions:
      contents: read
    outputs:
      package_name: ${{ steps.release-workflow.outputs.package_name }}
      npm_tag: ${{ steps.release-workflow.outputs.npm_tag }}
      pr_number: ${{ steps.release-workflow.outputs.pr_number }}
      pr_already_exists: ${{ steps.release-workflow.outputs.pr_already_exists }}
    steps:
      - name: Generate workflow helper read token
        id: helper-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.DEV_TOOLS_RELEASE_WORKFLOW_APP_ID }}
          private-key: ${{ secrets.DEV_TOOLS_RELEASE_WORKFLOW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: npm-release-workflows
          permission-contents: read

      - name: Generate release GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.DEV_TOOLS_RELEASE_WORKFLOW_APP_ID }}
          private-key: ${{ secrets.DEV_TOOLS_RELEASE_WORKFLOW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: heroku-cli-command
          permission-contents: write
          permission-pull-requests: write

      - name: Check out repository source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Check out shared release workflows
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: heroku/npm-release-workflows
          token: ${{ steps.helper-token.outputs.token }}
          path: workflows-repo
          ref: main
          persist-credentials: false

      - name: Create release PR
        id: release-workflow
        uses: ./workflows-repo/.github/actions/release-please-pr-public
        with:
          package-manager: npm
          branch_name: ${{ github.ref_name }}
          dry_run: ${{ inputs.dry_run }}
          token: ${{ steps.app-token.outputs.token }}

  publish:
    needs: release-please-pr
    if: >-
      needs.release-please-pr.result == 'success' &&
      (needs.release-please-pr.outputs.pr_number != '' || needs.release-please-pr.outputs.pr_already_exists == 'true') &&
      github.repository == 'heroku/heroku-cli-command' &&
      github.event_name == 'workflow_dispatch' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta')
    runs-on: pub-hk-ubuntu-24.04-ip
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Generate workflow helper read token
        id: helper-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.DEV_TOOLS_RELEASE_WORKFLOW_APP_ID }}
          private-key: ${{ secrets.DEV_TOOLS_RELEASE_WORKFLOW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: npm-release-workflows
          permission-contents: read

      - name: Check out repository source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check out shared release workflows
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: heroku/npm-release-workflows
          token: ${{ steps.helper-token.outputs.token }}
          path: workflows-repo
          ref: main
          persist-credentials: false

      - name: Publish to npm
        uses: ./workflows-repo/.github/actions/release-publish-public
        with:
          package-manager: npm
          workflows_token: ${{ steps.helper-token.outputs.token }}
          build_command: 'run build'
          dry_run: ${{ inputs.dry_run }}
          npm_tag: ${{ needs.release-please-pr.outputs.npm_tag }}
          package_name: ${{ needs.release-please-pr.outputs.package_name }}
          pr_number: ${{ needs.release-please-pr.outputs.pr_number }}
          branch_name: ${{ github.ref_name }}
