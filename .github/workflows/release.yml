name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Test release without publishing
        type: boolean
        default: false
        required: false

permissions:
  contents: read

jobs:
  trust-configuration-notice:
    if: >-
      github.repository == 'heroku/heroku-cli-command' &&
      vars.CREDENTIAL_MANAGER_INSTALL_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Explain fail-closed release
        run: echo 'Release is disabled until an owner protects CredentialManagerInstall and main/beta, configures npm trusted publishing, then sets CREDENTIAL_MANAGER_INSTALL_ENABLED=true.'

  validate:
    if: >-
      github.repository == 'heroku/heroku-cli-command' &&
      vars.CREDENTIAL_MANAGER_INSTALL_ENABLED == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta')
    environment: CredentialManagerInstall
    runs-on: pub-hk-ubuntu-24.04-ip
    steps:
      - name: Check out exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Generate workflow helper read token
        id: helper-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.DEV_TOOLS_RELEASE_WORKFLOW_APP_ID }}
          private-key: ${{ secrets.DEV_TOOLS_RELEASE_WORKFLOW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: npm-release-workflows
          permission-contents: read
      - name: Check out shared release workflows
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: heroku/npm-release-workflows
          token: ${{ steps.helper-token.outputs.token }}
          path: workflows-repo
          ref: 9cc6da3718f77f2abce513df70298d1ec821e516
          persist-credentials: false
      - name: Validate and test
        uses: ./workflows-repo/.github/actions/release-validate-public
        with:
          package-manager: npm
          node-version: '22'
          lint_command: 'run lint'
          test_command: 'test'

  release-please-pr:
    needs: validate
    if: >-
      needs.validate.result == 'success' &&
      github.repository == 'heroku/heroku-cli-command' &&
      vars.CREDENTIAL_MANAGER_INSTALL_ENABLED == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta')
    environment: CredentialManagerInstall
    runs-on: pub-hk-ubuntu-24.04-ip
    permissions:
      contents: read
    outputs:
      package_name: ${{ steps.release-workflow.outputs.package_name }}
      npm_tag: ${{ steps.release-workflow.outputs.npm_tag }}
      pr_number: ${{ steps.release-metadata.outputs.pr_number }}
      pr_branch: ${{ steps.release-metadata.outputs.pr_branch }}
      manifest_file: ${{ steps.release-workflow.outputs.manifest_file }}
      candidate_sha: ${{ steps.release-metadata.outputs.candidate_sha }}
      release_candidate: ${{ steps.release-metadata.outputs.release_candidate }}
    steps:
      - name: Confirm owner-controlled release prerequisites
        run: echo 'CredentialManagerInstall approval and protected main/beta source are required; repository enablement defaults fail-closed.'
      - name: Check out trusted release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - name: Generate workflow helper read token
        id: helper-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.DEV_TOOLS_RELEASE_WORKFLOW_APP_ID }}
          private-key: ${{ secrets.DEV_TOOLS_RELEASE_WORKFLOW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: npm-release-workflows
          permission-contents: read
      - name: Generate release GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.DEV_TOOLS_RELEASE_WORKFLOW_APP_ID }}
          private-key: ${{ secrets.DEV_TOOLS_RELEASE_WORKFLOW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: heroku-cli-command
          permission-contents: write
          permission-pull-requests: write
      - name: Check out shared release workflows
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: heroku/npm-release-workflows
          token: ${{ steps.helper-token.outputs.token }}
          path: workflows-repo
          ref: 9cc6da3718f77f2abce513df70298d1ec821e516
          persist-credentials: false
      - name: Create release PR
        id: release-workflow
        uses: ./workflows-repo/.github/actions/release-please-pr-public
        with:
          package-manager: npm
          node-version: '22'
          branch_name: ${{ github.ref_name }}
          dry_run: ${{ inputs.dry_run }}
          token: ${{ steps.app-token.outputs.token }}
      - name: Resolve and verify release candidate
        id: release-metadata
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PACKAGE_NAME: ${{ steps.release-workflow.outputs.package_name }}
          SHARED_NPM_TAG: ${{ steps.release-workflow.outputs.npm_tag }}
          SHARED_MANIFEST_FILE: ${{ steps.release-workflow.outputs.manifest_file }}
          SHARED_PR_NUMBER: ${{ steps.release-workflow.outputs.pr_number }}
          SHARED_NO_RELEASE_NEEDED: ${{ steps.release-workflow.outputs.no_release_needed }}
          SHARED_PR_ALREADY_EXISTS: ${{ steps.release-workflow.outputs.pr_already_exists }}
          REPOSITORY: ${{ github.repository }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          UNSCOPED_PACKAGE_NAME="${PACKAGE_NAME#@*/}"
          PR_BRANCH="release-please--branches--$TARGET_BRANCH--components--$UNSCOPED_PACKAGE_NAME"
          if [ "$SHARED_NO_RELEASE_NEEDED" = 'true' ] &&
            [ "$SHARED_PR_ALREADY_EXISTS" != 'true' ] &&
            [ -z "$SHARED_PR_NUMBER" ]; then
            echo 'release_candidate=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          OPEN_PRS=$(gh api "repos/$REPOSITORY/pulls?state=open&head=$REPOSITORY:$PR_BRANCH&base=$TARGET_BRANCH")
          PR_RECORD=$(OPEN_PRS="$OPEN_PRS" REPOSITORY="$REPOSITORY" PR_BRANCH="$PR_BRANCH" TARGET_BRANCH="$TARGET_BRANCH" node -e '
            const prs = JSON.parse(process.env.OPEN_PRS);
            const pr = prs.find(item =>
              item.state === "open" &&
              item.head?.repo?.full_name === process.env.REPOSITORY &&
              item.head?.ref === process.env.PR_BRANCH &&
              item.base?.ref === process.env.TARGET_BRANCH
            );
            if (!pr) process.exit(0);
            process.stdout.write([
              String(pr.number ?? ""),
              pr.state ?? "",
              pr.head?.repo?.full_name ?? "",
              pr.head?.ref ?? "",
              pr.base?.ref ?? "",
              pr.head?.sha ?? "",
            ].join("\n"));
          ')
          if [ -z "$PR_RECORD" ]; then
            if [ "$SHARED_NO_RELEASE_NEEDED" = 'true' ]; then
              echo 'release_candidate=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo 'Expected release PR was not found; refusing to build a candidate' >&2
            exit 1
          fi
          mapfile -t PR_FIELDS <<< "$PR_RECORD"
          PR_NUMBER="${PR_FIELDS[0]}"
          PR_STATE="${PR_FIELDS[1]}"
          PR_HEAD_REPO="${PR_FIELDS[2]}"
          PR_BRANCH="${PR_FIELDS[3]}"
          PR_BASE_BRANCH="${PR_FIELDS[4]}"
          CANDIDATE_SHA="${PR_FIELDS[5]}"

          test "$PR_STATE" = 'open'
          test "$PR_HEAD_REPO" = "$REPOSITORY"
          test "$PR_BRANCH" = "release-please--branches--$TARGET_BRANCH--components--$UNSCOPED_PACKAGE_NAME"
          test "$PR_BASE_BRANCH" = "$TARGET_BRANCH"
          test -n "$CANDIDATE_SHA"
          test "$(gh api "repos/$REPOSITORY/git/ref/heads/$PR_BRANCH" --jq '.object.sha')" = "$CANDIDATE_SHA"
          if [ -n "$SHARED_PR_NUMBER" ] && [ "$SHARED_PR_NUMBER" != "$PR_NUMBER" ]; then
            echo 'Shared action PR number does not match the validated release PR' >&2
            exit 1
          fi

          case "$TARGET_BRANCH:$SHARED_NPM_TAG:$SHARED_MANIFEST_FILE" in
            main:latest:.github/release-configs/release-please-manifest.json) ;;
            beta:beta:.github/release-configs/release-please-manifest.beta.json) ;;
            *) echo 'Shared release action returned unexpected channel metadata' >&2; exit 1 ;;
          esac
          echo "candidate_sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "pr_branch=$PR_BRANCH" >> "$GITHUB_OUTPUT"
          echo 'release_candidate=true' >> "$GITHUB_OUTPUT"

  build-package:
    needs: release-please-pr
    if: >-
      needs.release-please-pr.outputs.release_candidate == 'true' &&
      github.repository == 'heroku/heroku-cli-command' &&
      vars.CREDENTIAL_MANAGER_INSTALL_ENABLED == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta')
    environment: CredentialManagerInstall
    runs-on: pub-hk-ubuntu-24.04-ip
    permissions:
      contents: read
    outputs:
      tarball_name: ${{ steps.pack.outputs.tarball_name }}
      tarball_sha256: ${{ steps.pack.outputs.tarball_sha256 }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Check out exact release candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please-pr.outputs.candidate_sha }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false
      - name: Assert exact candidate package and channel
        id: candidate
        shell: bash
        working-directory: candidate
        env:
          CANDIDATE_SHA: ${{ needs.release-please-pr.outputs.candidate_sha }}
          MANIFEST_FILE: ${{ needs.release-please-pr.outputs.manifest_file }}
          NPM_TAG: ${{ needs.release-please-pr.outputs.npm_tag }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          PACKAGE_NAME=$(node -p 'require("./package.json").name')
          PACKAGE_VERSION=$(node -p 'require("./package.json").version')
          MANIFEST_VERSION=$(MANIFEST_FILE="$MANIFEST_FILE" node -e 'process.stdout.write(require("./" + process.env.MANIFEST_FILE)["."] ?? "")')
          test "$PACKAGE_NAME" = '@heroku-cli/command'
          test "$PACKAGE_VERSION" = "$MANIFEST_VERSION"
          case "$NPM_TAG" in
            latest) [[ "$PACKAGE_VERSION" != *-* ]] ;;
            beta) [[ "$PACKAGE_VERSION" == *-beta.* ]] ;;
            *) exit 1 ;;
          esac
          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install dependencies
        working-directory: candidate
        run: npm ci
      - name: Build and test release candidate
        working-directory: candidate
        run: |
          npm run build
          npm test
          npm run verify:rollback
      - name: Verify packed consumer
        working-directory: candidate
        run: npm run verify:packed-consumer
      - name: Pack command tarball
        id: pack
        shell: bash
        working-directory: candidate
        env:
          CANDIDATE_SHA: ${{ needs.release-please-pr.outputs.candidate_sha }}
          PACKAGE_NAME: ${{ steps.candidate.outputs.package_name }}
          PACKAGE_VERSION: ${{ steps.candidate.outputs.package_version }}
          NPM_TAG: ${{ needs.release-please-pr.outputs.npm_tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-artifact"
          TARBALL=$(npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/release-artifact" --json | node -e 'let data=""; process.stdin.on("data", chunk => data += chunk); process.stdin.on("end", () => process.stdout.write(JSON.parse(data)[0].filename))')
          SHA256=$(shasum -a 256 "$RUNNER_TEMP/release-artifact/$TARBALL" | cut -d ' ' -f 1)
          printf '%s  %s\n' "$SHA256" "$TARBALL" > "$RUNNER_TEMP/release-artifact/SHA256SUMS"
          printf '%s\n' "$CANDIDATE_SHA" > "$RUNNER_TEMP/release-artifact/SOURCE_SHA"
          printf '%s\n' "$PACKAGE_NAME" > "$RUNNER_TEMP/release-artifact/PACKAGE_NAME"
          printf '%s\n' "$PACKAGE_VERSION" > "$RUNNER_TEMP/release-artifact/PACKAGE_VERSION"
          printf '%s\n' "$NPM_TAG" > "$RUNNER_TEMP/release-artifact/NPM_TAG"
          {
            echo "tarball_name=$TARBALL"
            echo "tarball_sha256=$SHA256"
          } >> "$GITHUB_OUTPUT"
      - name: Upload command tarball and digest
        id: upload
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: command-release-candidate
          path: |
            ${{ runner.temp }}/release-artifact/${{ steps.pack.outputs.tarball_name }}
            ${{ runner.temp }}/release-artifact/SHA256SUMS
            ${{ runner.temp }}/release-artifact/SOURCE_SHA
            ${{ runner.temp }}/release-artifact/PACKAGE_NAME
            ${{ runner.temp }}/release-artifact/PACKAGE_VERSION
            ${{ runner.temp }}/release-artifact/NPM_TAG
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [release-please-pr, build-package]
    if: >-
      needs.build-package.result == 'success' &&
      github.repository == 'heroku/heroku-cli-command' &&
      vars.CREDENTIAL_MANAGER_INSTALL_ENABLED == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta')
    environment: CredentialManagerInstall
    runs-on: pub-hk-ubuntu-24.04-ip
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
    steps:
      - name: Generate release GitHub App read token
        id: release-read-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.DEV_TOOLS_RELEASE_WORKFLOW_APP_ID }}
          private-key: ${{ secrets.DEV_TOOLS_RELEASE_WORKFLOW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: heroku-cli-command
          permission-contents: read
          permission-pull-requests: read
      - name: Download exact release artifact
        shell: bash
        env:
          ARTIFACT_ID: ${{ needs.build-package.outputs.artifact_id }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-artifact"
          gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/artifacts" --paginate --slurp |
            ARTIFACT_ID="$ARTIFACT_ID" node -e '
              let input = "";
              process.stdin.on("data", chunk => input += chunk);
              process.stdin.on("end", () => {
                const pages = JSON.parse(input);
                const artifacts = pages.flatMap(page => page.artifacts || []);
                const artifact = artifacts.find(item => String(item.id) === process.env.ARTIFACT_ID);
                if (!artifact || artifact.expired || artifact.name !== "command-release-candidate" || artifact.size_in_bytes <= 0) process.exit(1);
              });
            '
          gh api "repos/$REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/release-artifact.zip"
          unzip -q "$RUNNER_TEMP/release-artifact.zip" -d "$RUNNER_TEMP/release-artifact"
      - name: Check out trusted npm configuration helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: trusted-release-workflow
          sparse-checkout: scripts/public-npm-config.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Set up Node.js for OIDC publish
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x
          package-manager-cache: false
      - name: Prepare isolated public npm configuration
        run: node trusted-release-workflow/scripts/public-npm-config.mjs setup
      - name: Install exact npm trusted-publishing client
        env:
          EXPECTED_NPM_VERSION: 11.6.2
        run: npm install --global --ignore-scripts --no-audit --no-fund "npm@$EXPECTED_NPM_VERSION"
      - name: Verify exact npm trusted-publishing client version
        env:
          EXPECTED_NPM_VERSION: 11.6.2
        run: test "$(npm --version)" = "$EXPECTED_NPM_VERSION"
      - name: Verify and publish tarball
        shell: bash
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ steps.release-read-token.outputs.token }}
          PR_NUMBER: ${{ needs.release-please-pr.outputs.pr_number }}
          PR_BRANCH: ${{ needs.release-please-pr.outputs.pr_branch }}
          REPOSITORY: ${{ github.repository }}
          TARGET_BRANCH: ${{ github.ref_name }}
          NPM_TAG: ${{ needs.release-please-pr.outputs.npm_tag }}
          TARBALL_NAME: ${{ needs.build-package.outputs.tarball_name }}
          TARBALL_SHA256: ${{ needs.build-package.outputs.tarball_sha256 }}
          CANDIDATE_SHA: ${{ needs.release-please-pr.outputs.candidate_sha }}
          EXPECTED_PACKAGE_NAME: '@heroku-cli/command'
        run: |
          set -euo pipefail
          PR_DATA=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")
          PR_FIELDS=$(PR_DATA="$PR_DATA" REPOSITORY="$REPOSITORY" PR_BRANCH="$PR_BRANCH" TARGET_BRANCH="$TARGET_BRANCH" CANDIDATE_SHA="$CANDIDATE_SHA" node -e '
            const pr = JSON.parse(process.env.PR_DATA);
            const valid = pr.state === "open" &&
              pr.head?.repo?.full_name === process.env.REPOSITORY &&
              pr.head?.ref === process.env.PR_BRANCH &&
              pr.head?.sha === process.env.CANDIDATE_SHA &&
              pr.base?.ref === process.env.TARGET_BRANCH;
            if (!valid) process.exit(1);
            process.stdout.write("valid\n");
          ')
          test "$PR_FIELDS" = 'valid'
          test "$(gh api "repos/$REPOSITORY/git/ref/heads/$PR_BRANCH" --jq '.object.sha')" = "$CANDIDATE_SHA"

          ARTIFACT="$RUNNER_TEMP/release-artifact/$TARBALL_NAME"
          test "$(cat "$RUNNER_TEMP/release-artifact/SOURCE_SHA")" = "$CANDIDATE_SHA"
          test "$(cat "$RUNNER_TEMP/release-artifact/PACKAGE_NAME")" = "$EXPECTED_PACKAGE_NAME"
          test "$(cat "$RUNNER_TEMP/release-artifact/NPM_TAG")" = "$NPM_TAG"
          PACKED_MANIFEST=$(tar -xOf "$ARTIFACT" package/package.json)
          PACKED_NAME=$(PACKED_MANIFEST="$PACKED_MANIFEST" node -e 'process.stdout.write(JSON.parse(process.env.PACKED_MANIFEST).name ?? "")')
          PACKED_VERSION=$(PACKED_MANIFEST="$PACKED_MANIFEST" node -e 'process.stdout.write(JSON.parse(process.env.PACKED_MANIFEST).version ?? "")')
          test "$PACKED_NAME" = "$EXPECTED_PACKAGE_NAME"
          test "$PACKED_VERSION" = "$(cat "$RUNNER_TEMP/release-artifact/PACKAGE_VERSION")"
          case "$NPM_TAG" in
            latest) [[ "$PACKED_VERSION" != *-* ]] ;;
            beta) [[ "$PACKED_VERSION" == *-beta.* ]] ;;
            *) exit 1 ;;
          esac
          test "$(shasum -a 256 "$ARTIFACT" | cut -d ' ' -f 1)" = "$TARBALL_SHA256"
          (cd "$RUNNER_TEMP/release-artifact" && shasum -a 256 -c SHA256SUMS)
          if [ "$DRY_RUN" = 'true' ]; then
            npm publish "$ARTIFACT" --ignore-scripts --dry-run --tag "$NPM_TAG"
          else
            npm publish "$ARTIFACT" --ignore-scripts --tag "$NPM_TAG"
          fi
      - name: Remove isolated public npm configuration
        if: always()
        run: node trusted-release-workflow/scripts/public-npm-config.mjs cleanup
