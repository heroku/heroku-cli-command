name: Update Release Configs

# Generates release-please config files from release-channels.yml
# Uses vars.DEV_TOOLS_RELEASE_WORKFLOW_APP_ID and secrets.DEV_TOOLS_RELEASE_WORKFLOW_APP_PRIVATE_KEY

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-configs:
    if: >-
      github.repository == 'heroku/heroku-cli-command' &&
      github.event_name == 'workflow_dispatch' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta')
    runs-on: pub-hk-ubuntu-24.04-ip
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Generate workflow helper read token
        id: helper-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.DEV_TOOLS_RELEASE_WORKFLOW_APP_ID }}
          private-key: ${{ secrets.DEV_TOOLS_RELEASE_WORKFLOW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: npm-release-workflows
          permission-contents: read

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Check out shared release workflows
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: heroku/npm-release-workflows
          token: ${{ steps.helper-token.outputs.token }}
          path: workflows-repo
          ref: 9cc6da3718f77f2abce513df70298d1ec821e516
          persist-credentials: false

      - name: Update release configs
        uses: ./workflows-repo/.github/actions/update-release-configs-job-public
